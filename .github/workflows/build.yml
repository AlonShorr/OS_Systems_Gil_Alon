name: Build OS Projects

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ gcc

      - name: Build Smash
        run: |
          cd 1.Smash
          make

      - name: Build Bank
        run: |
          cd 2.bank
          make

      - name: Build Custom Allocator
        run: |
          cd 3.Custom_Allocator
          gcc -Wall -Wextra -Werror main.c customAllocator.c -o allocator_test
